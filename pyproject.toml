[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-space-optimizer"
version = "1.0.0"
description = "Find and remove unnecessary development folders (node_modules, vendor, .venv, ...) under selected parent folders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pro Space Optimizer contributors" }]
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pro-space-optimizer = "pro_space_optimizer.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pro_space_optimizer = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
